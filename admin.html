<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1250">
    <title>Email Broadcaster | Drew Sossomon Admin</title>
    <!-- Add Google Fonts properly -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* Color Variables matching your dark navy theme */
        :root {
            --bg-dark-navy: #0a1128;
            --card-navy: #131f42;
            --electric-blue: #00d2ff;
            --text-white: #ffffff;
            --text-muted: #94a3b8;
        }

        body { 
            background-color: var(--bg-dark-navy); 
            color: var(--text-white); 
            font-family: 'Outfit', sans-serif; 
            margin: 0; 
            padding: 40px 20px;
        }

        .container { 
            max-width: 800px; 
            margin: 0 auto; 
        }

        .btn-back { 
            display: inline-block; 
            color: var(--text-muted); 
            text-decoration: none; 
            border: 1px solid var(--text-muted); 
            padding: 8px 16px; 
            border-radius: 4px; 
            font-weight: 700; 
            text-transform: uppercase; 
            margin-bottom: 30px;
            transition: all 0.2s;
        }

        .btn-back:hover {
            color: var(--text-white);
            border-color: var(--text-white);
        }

        .admin-title { 
            color: var(--text-white); 
            font-family: 'Big Shoulders Display', sans-serif; 
            font-size: 3rem; 
            margin-bottom: 5px;
        }

        .admin-subtitle { 
            color: var(--electric-blue); 
            font-weight: 700; 
            text-transform: uppercase; 
            margin-bottom: 30px;
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        .dashboard-card {
            background-color: var(--card-navy);
            border: 2px dashed var(--electric-blue); 
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .dashboard-card h3 { 
            color: var(--electric-blue); 
            margin-top: 0; 
            font-size: 1.5rem;
        }

        .dashboard-form { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }

        .dashboard-form label {
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .dash-input {
            padding: 14px;
            border: 2px solid #1e2d5a;
            background-color: #0a1128;
            color: #ffffff;
            border-radius: 6px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .dash-input:focus { 
            border-color: var(--electric-blue); 
            outline: none; 
        }

        .dash-select {
            cursor: pointer;
            font-weight: 700;
            color: var(--electric-blue);
            background-color: #0a1128;
        }

        .btn-broadcast {
            background-color: var(--electric-blue);
            color: #0a1128;
            border: none;
            padding: 16px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 1.1rem;
            letter-spacing: 1px;
            transition: opacity 0.2s;
            margin-top: 10px;
        }

        .btn-broadcast:hover {
            opacity: 0.9;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- SECURE PASSWORD GATE LAYER -->
    <script>
        var password = prompt("Enter Admin Secure Passcode:");
        if (password !== "Wall2026") {
            alert("Access Denied.");
            window.location.href = "index.html"; 
        }
    </script>

    <main class="container">

        <a href="index.html" class="btn-back">← Exit to Public Site</a>

        <h1 class="admin-title">PRIVATE BROADCAST STATION</h1>
        <p class="admin-subtitle">Secure Admin Control Panel | Drew Sossomon Portfolio</p>

        <div class="dashboard-card">

            <h3>Custom Distribution Broadcaster</h3>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Type your status update below. Select whether to blast the message to your complete network list or isolate a single individual recipient.</p>

            <div class="dashboard-form">

                <!-- TARGET RECIPIENT TOGGLE SELECTION -->
                <label for="recipient-type">Send Target Mode:</label>
                <select id="recipient-type" onchange="toggleRecipientInput()" class="dash-input dash-select">
                    <option value="all">Full Network Feed Distribution List (13 Contacts via BCC)</option>
                    <option value="single">Single Recipient Only (Direct Email Target)</option>
                </select>

                <!-- SINGLE RECIPIENT INPUT (HIDDEN BY DEFAULT) -->
                <div id="single-email-container" class="dashboard-form hidden">
                    <label for="single-email-input">Target Recipient Email Address:</label>
                    <input type="email" id="single-email-input" placeholder="coach@university.edu" class="dash-input">
                </div>

                <label for="update-subject">Email Subject Line:</label>
                <input type="text" id="update-subject" value="Drew Sossomon Career Update | National One League & Recovery" class="dash-input">

                <label for="update-body">Email Body Text Message Content:</label>
                <textarea id="update-body" rows="10" class="dash-input">Hello,

I wanted to share a quick update regarding my recovery progress and soccer career.

[Type your new milestone or update text details right here…]

You can view my interactive highlights tracker online at:
https://github.io

Thank you for your support,
Drew Sossomon
dsossomon@gmail.com</textarea>

                <button onclick="launchEmailBroadcast()" class="btn-broadcast">Launch Email Broadcast</button>
            </div>
        </div>

    </main>

    <!-- INTERACTIVE BROADCASTER SCRIPTS -->
    <script>
        function toggleRecipientInput() {
            const selectMode = document.getElementById('recipient-type').value;
            const singleContainer = document.getElementById('single-email-container');
            
            if (selectMode === 'single') {
                singleContainer.classList.remove('hidden');
            } else {
                singleContainer.classList.add('hidden');
            }
        }

        function launchEmailBroadcast() {
            // Master distribution array list storage
            const subscriberList = [
                // Friends
                "Sylverwolf7@gmail.com",
                "6sossomons@gmail.com",
                "tylerpuetzer@gmail.com",
                "crhill1707@gmail.com",
                "nugentm1212@gmail.com",
                "javier56ochoa@gmail.com",
                // Former teachers/friends
                "wanda.evans@youngsvilleacademy.org",
                "nathanael.stamp@youngsvilleacademy.org",
                "elizabeth@cpsfc.org",
                "joshua@cpsfc.org",
                "karen@cpsfc.org",
                // Coaches
                "apuetzer@gmail.com",
                "coachdgillespie@ncsasports.org"
            ];

            const selectMode = document.getElementById('recipient-type').value;
            const subjectText = encodeURIComponent(document.getElementById('update-subject').value);
            const bodyText = encodeURIComponent(document.getElementById('update-body').value);
            let targetUrl = "";

            if (selectMode === 'all') {
                // Blast to full distribution array list via hidden BCC line
                const bccString = subscriberList.join(',');
                targetUrl = `mailto:dsossomon@://gmail.com{bccString}&subject=${subjectText}&body=${bodyText}`;
            } else {
                // Isolate targeting string values to a unique direct address input
                const singleEmail = document.getElementById('single-email-input').value;
                if (!singleEmail) {
                    alert("Please input a valid recipient email address first.");
                    return;
                }
                targetUrl = `mailto:${singleEmail}?subject=${subjectText}&body=${bodyText}`;
            }

            window.location.href = targetUrl;
        }
    </script>

</body>
</html>
